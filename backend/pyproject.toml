[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kanak Goel", email = "sujalgoel19@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.29.0",
    "bcrypt>=4.1.2",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pgvector>=0.2.5",
    "psycopg2-binary>=2.9.9",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyjwt[crypto]>=2.8.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.28",
    "uvicorn[standard]>=0.28.0",
    "email-validator>=2.3.0",
]

[project.scripts]
serve = "uvicorn:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
