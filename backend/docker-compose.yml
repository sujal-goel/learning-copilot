services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: learning_copilot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learning_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_copilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
